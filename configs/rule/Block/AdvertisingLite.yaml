# ----------------------------------------------------------------------
# 规则集配置文件 (YAML 格式)
# 描述: 用于定义一个规则集任务的名称、来源、处理和输出格式。
# ----------------------------------------------------------------------

# 集名称：一个可读的名称，将用于日志输出和最终文件头部的注释。
# 建议修改
name: 'AdvertisingLite规则集'

# -------------------- 【项目控制】 --------------------
# enabled: 是否启用本规则集。默认由 configs/defaults_rule.yaml 统一控制（当前为启用）。
# 想单独关闭这个规则集时，去掉下面这行的注释即可，不影响其他规则集。
# enabled: false

# collection: 规则集标识，用于输出文件名、README 和日志里的名字。
# 不写就默认取本文件名（去掉 .yaml）。
# 只有想让标识和文件名不一致时才需要写，例如：
# collection: 'CustomName'

# policy: 策略名，决定这些规则在分流时走哪个策略组（例如 'Proxy'、'Reject'）。
# 目前只有 Quantumult X 会把策略名写进规则行，其他格式暂时用不上。
# 不写就默认继承 collection。
# policy: 'Proxy'

# formats: 输出格式由 configs/defaults_rule.yaml 统一控制（见该文件的注释）。
# 如果这个规则集需要和其他规则集不一样，再在这里写一份 formats 覆盖通用配置即可。

# -------------------- 【上游来源】 --------------------
# sources: 包含原始数据的 URL 列表。
sources:
  - 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list'
  - 'https://raw.githubusercontent.com/ConnersHua/RuleGo/refs/heads/master/Surge/Ruleset/Extra/Reject/Advertising.list'

# -------------------- 【过滤与定制】 --------------------
# filters: 包含所有用于定制规则集的自定义配置。
# 处理顺序为由上到下依次匹配（先去重，后过滤关键词）。
# 如果不需要任何过滤，请保持列表为空，即 []。
# 所有配置项不区分大小写

filters:
  # ignored_rules: 移除指定项（黑名单 - 精确匹配）。
  # 只需写"类型,值"；后面再写策略名或 no-resolve 不影响匹配，会被忽略。
  ignored_rules: []
    # - 'DOMAIN,example.com'
    # - 'IP-CIDR,1.2.3.4/32'

  # exclude_keywords: 移除包含指定关键词的数据（黑名单 - 模糊匹配）。
  # 任何包含关键词的整行数据都将被过滤。
  exclude_keywords: []
    # - 'ad'
    # - 'tracker'

  # include_keywords: 仅保留包含指定关键词的数据（白名单）。
  # 如果此列表非空，只有包含列表中任一关键词的数据才会被保留。
  # （注意：如果同时设置了 exclude_keywords，先执行 exclude 过滤，后执行 include 过滤。）
  include_keywords: []
    # - 'example'
    # - 'demo'

  # extra_rules: 手动追加最终数据。
  # 此配置项会被追加到最终输出文件正文的开头。
  # 同样只需写"类型,值"；后面的内容会被忽略（参数由各客户端自己决定）。
  extra_rules: []
    # - 'DOMAIN-SUFFIX,example.com'
    # - 'IP-CIDR,1.2.3.4/32'

# -------------------- 【自定义头部信息】 --------------------
# custom_headers: 定义针对不同输出格式的自定义头部注释。
# 这些头部信息将追加在全局默认的头部信息（如作者、更新时间）之后，规则集数据正文之前。
# 必须在顶部的 'formats:' 字段中启用了相应格式，此处的自定义内容才会生效。
# 每一行为一条独立头部信息。
custom_headers:
  quantumultx:
    header_lines: []
      # - 'info1'
      # - 'info2'
  clash:
    header_lines: []
      # - 'info3'
      # - 'info4'
  loon:
    header_lines: []
      # - 'info5'
      # - 'info6'