# ----------------------------------------------------------------------
# rule 阶段的通用配置（可选文件）
# 描述: 这里写的字段会作为所有 rule 配置的默认值。
# 规则: 单份配置里写了同名字段（哪怕是空值）就以配置文件为准，没写才用这里。
# 目前只支持 formats 和 enabled 两个字段，写别的会被忽略并报警告。
# ----------------------------------------------------------------------

# formats: 所有规则集默认输出哪些格式。
# 当前 rule 阶段实际支持（有对应翻译器）的格式只有这三种：
#   'quantumultx'   Quantumult X 的 .list
#   'clash'         Clash 的三个 .yaml（Domain / IP / Classical）
#   'loon'          Loon 的 .list
# 想让全部规则集多输出一种格式：只改这里一处，不用再挨个改配置文件。
# 某个规则集格式不同：在它自己的配置文件里写一份 formats 覆盖这里。
formats:
  - 'quantumultx'
  - 'clash'

# enabled: 规则集默认是否启用（所有配置都不写这个字段时，就等于启用）。
# 某份配置想临时关闭：在它自己的文件里去掉 "# enabled: false" 那行的注释。
enabled: true
